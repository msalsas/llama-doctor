[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-doctor"
dynamic = ["version"]
description = "Non-invasive health diagnosis for local LLM inference servers via /metrics and /props."
authors = [{name = "Manolo Salsas"}]
license = "MIT"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
keywords = ["llama.cpp", "llm", "inference", "diagnostics", "metrics", "prometheus", "cli", "gguf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/msalsas/llama-doctor"
Repository = "https://github.com/msalsas/llama-doctor"
Issues = "https://github.com/msalsas/llama-doctor/issues"

[project.scripts]
llama-doctor = "llama_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "llama_doctor.__version__"}

[tool.setuptools.package-data]
"llama_doctor.dashboard" = ["static/*", "static/vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
